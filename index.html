<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player - Gemini Interface</title>
    <style>
        /* Base Reset & Variables */
        :root {
            --bg-color: #131314;
            --sidebar-bg: #1e1f20;
            --surface-color: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-color: #a8c7fa;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transition: width 0.3s ease;
        }

        .new-chat-btn {
            background-color: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 12px 16px;
            border-radius: 20px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 20px;
            font-size: 22px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .chat-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .ai-greeting {
            font-size: 44px;
            font-weight: 500;
            background: -webkit-linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #d96570 24%, #9b72cb 35%, #4285f4 44%, #9b72cb 50%, #d96570 56%, #131314 75%, #131314 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10vh;
        }

        .ai-subtitle {
            font-size: 44px;
            color: #444746;
            margin-top: -10px;
        }

        /* Bottom Audio Player Area */
        .bottom-container {
            padding: 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(19, 19, 20, 0) 0%, var(--bg-color) 40%);
        }

        .audio-player {
            width: 100%;
            max-width: 820px;
            background-color: var(--surface-color);
            border-radius: 32px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Play/Pause Button */
        .play-pause-btn {
            background-color: var(--text-primary);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
            flex-shrink: 0;
        }

        .play-pause-btn:hover {
            transform: scale(1.05);
            background-color: #ffffff;
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }

        .play-pause-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Track Info */
        .time-display {
            font-size: 13px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            min-width: 45px;
            text-align: center;
        }

        /* Progress Bar (Range Input) */
        .progress-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            position: relative;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #444746;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            margin-top: -4px; /* Centers thumb on the track */
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Progress Fill Overlay */
        .progress-fill {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            height: 6px;
            background-color: var(--text-primary);
            border-radius: 4px;
            pointer-events: none;
            width: 0%;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            New chat
        </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">Gemini</div>
        
        <div class="chat-container">
            <div class="message">
                <h1 class="ai-greeting">Hello.</h1>
                <h2 class="ai-subtitle">Ready to listen?</h2>
            </div>
        </div>

        <!-- Bottom Audio Player -->
        <div class="bottom-container">
            <div class="audio-player">
                
                <button class="play-pause-btn" id="playBtn" aria-label="Play">
                    <!-- SVG Path transforms between Play and Pause states -->
                    <svg id="playIcon" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" id="iconPath"/>
                    </svg>
                </button>
                
                <div class="time-display" id="currentTime">0:00</div>
                
                <div class="progress-wrapper">
                    <input type="range" id="progressBar" value="0" step="0.1" min="0">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="time-display" id="totalDuration">0:00</div>
            </div>
        </div>
    </div>

    <script>
        // Set Audio Source to the specific filename
        const audio = new Audio("The_Logic_of_Ultimate_Computation__Redefining_Reality,_Numbers,_and_Existence.m4a");
        
        // DOM Elements
        const playBtn = document.getElementById("playBtn");
        const iconPath = document.getElementById("iconPath");
        const progressBar = document.getElementById("progressBar");
        const progressFill = document.getElementById("progressFill");
        const currentTimeEl = document.getElementById("currentTime");
        const totalDurationEl = document.getElementById("totalDuration");

        // SVG Paths for transformation
        const playPath = "M8 5v14l11-7z"; // Triangle play icon
        const pausePath = "M6 19h4V5H6v14zm8-14v14h4V5h-4z"; // Double bar pause icon

        let isPlaying = false;

        // Format time in MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Toggle Play/Pause
        playBtn.addEventListener("click", () => {
            if (isPlaying) {
                audio.pause();
                iconPath.setAttribute("d", playPath);
            } else {
                audio.play();
                iconPath.setAttribute("d", pausePath);
            }
            isPlaying = !isPlaying;
            
            // Add a slight rotation animation effect during transition
            const svg = playBtn.querySelector('svg');
            svg.style.transform = 'scale(0.8) rotate(90deg)';
            setTimeout(() => {
                svg.style.transform = 'scale(1) rotate(0deg)';
            }, 150);
        });

        // Load Metadata (Get Duration)
        audio.addEventListener("loadedmetadata", () => {
            progressBar.max = audio.duration;
            totalDurationEl.textContent = formatTime(audio.duration);
        });

        // Update Progress Bar as Audio Plays
        audio.addEventListener("timeupdate", () => {
            progressBar.value = audio.currentTime;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            
            // Update the visual fill of the progress bar
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percentage}%`;
        });

        // Seek (Scrub) functionality when user drags the slider
        progressBar.addEventListener("input", () => {
            audio.currentTime = progressBar.value;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            
            // Update visual fill immediately while dragging
            const percentage = (progressBar.value / audio.duration) * 100;
            progressFill.style.width = `${percentage}%`;
        });

        // Reset when audio finishes
        audio.addEventListener("ended", () => {
            isPlaying = false;
            iconPath.setAttribute("d", playPath);
            progressBar.value = 0;
            progressFill.style.width = "0%";
            audio.currentTime = 0;
            currentTimeEl.textContent = "0:00";
        });
    </script>
</body>
</html>
